server:
  port: 8081
spring:
  application:
    name: hmdp
  mvc:
    # springfox 3.0.0 与 Spring Boot 2.6+ 默认的 PathPatternParser 不兼容，启动会报 Failed to start 'documentationPluginsBootstrapper'，必须改回 ant 匹配策略
    # 属性名必须是 pathmatch（对应 WebMvcProperties#pathMatch），写错会被静默忽略从而仍然报错
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 20232131050
  redis:
    host: 127.0.0.1
    port: 6379
    # 本机 Redis 未设置 requirepass，配置密码会导致 AUTH 报错；若给 Redis 设了密码再打开此行
#    password: 123456
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
